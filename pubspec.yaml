name: sanad
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  animated_snack_bar: ^0.4.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  firebase_core: ^4.6.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.4.0
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.4
  get_it: ^9.2.1
  go_router: ^17.1.0
  google_nav_bar: ^5.0.7
  image_picker: ^1.2.1
  intl: ^0.20.2
  json_annotation: ^4.11.0
  path_provider: ^2.1.5
  pretty_dio_logger: ^1.4.0
  provider: ^6.1.5+1
  retrofit: ^4.9.2
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3

dev_dependencies:
  build_runner: ^2.13.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.13.1
  retrofit_generator: ^10.2.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icons_account/
    - assets/SVG/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
